openapi: 3.1.0
info:
  title: <Service> API
  version: 0.1.0
  description: Traceability - each operation lists features/ACs in x-features.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /resources:
    get:
      operationId: listResources
      summary: List resources
      x-features: [F-01, AC-01.1]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createResource
      x-features: [F-02]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
    ResourceCreate:
      type: object
    ResourcePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Resource" } }
        next_cursor: { type: [string, "null"] }
